[project]
name = "routewise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<5.3", "djangorestframework>=3.16,<4", "httpx>=0.28,<1", "python-dotenv>=1.1,<2", "whitenoise>=6.9,<7", "gunicorn>=23,<24", "timezonefinder>=6.5,<7"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.10,<5", "ruff>=0.11", "pillow>=11"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["backend/trips/tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
